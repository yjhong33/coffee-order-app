document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

atform: 20; /* @kind spacing */\n  --value-padding-card-tiny: 6; /* @kind spacing */\n  --value-space-gap-normal: 20; /* @kind spacing */\n  --value-width-viewport-lg: 1100; /* @kind spacing */\n  --value-width-viewport-xl: 1440; /* @kind spacing */\n  --variant-platform: \"Desktop\"; /* @kind other */\n}\n\n:root[data-mode=\"small\"] {\n  --height-popup-max: 760; /* @kind spacing */\n  --margin-action-contents-bottom: 4; /* @kind spacing */\n  --margin-action-normal-horizontal: 16; /* @kind spacing */\n  --margin-action-normal-vertical: 16; /* @kind spacing */\n  --margin-content-content: 20; /* @kind spacing */\n  --margin-navigation-horizontal: 16; /* @kind spacing */\n  --margin-navigation-normal: 16; /* @kind spacing */\n  --margin-navigation-text: 4; /* @kind spacing */\n  --margin-navigation-tool-tab: 12; /* @kind spacing */\n  --padding-horizontal: 12; /* @kind spacing */\n  --padding-vertical: 4; /* @kind spacing */\n  --radius-2: 12; /* @kind radius */\n  --radius-3: 12; /* @kind radius */\n  --radius: 12; /* @kind radius */\n  --width-max: 1060; /* @kind spacing */\n  --width-min: 320; /* @kind spacing */\n  --width-normal: 360; /* @kind spacing */\n}\n\n:root[data-mode=\"large\"] {\n  --height-popup-max: 760; /* @kind spacing */\n  --margin-action-contents-bottom: 0; /* @kind spacing */\n  --margin-action-normal-horizontal: 24; /* @kind spacing */\n  --margin-action-normal-vertical: 24; /* @kind spacing */\n  --margin-content-content: 24; /* @kind spacing */\n  --margin-navigation-horizontal: 20; /* @kind spacing */\n  --margin-navigation-normal: 20; /* @kind spacing */\n  --margin-navigation-text: 4; /* @kind spacing */\n  --margin-navigation-tool-tab: 16; /* @kind spacing */\n  --padding-horizontal: 20; /* @kind spacing */\n  --padding-vertical: 4; /* @kind spacing */\n  --radius-2: 16; /* @kind radius */\n  --radius-3: 16; /* @kind radius */\n  --radius: 20; /* @kind radius */\n  --width-max: 1060; /* @kind spacing */\n  --width-min: 320; /* @kind spacing */\n  --width-normal: 480; /* @kind spacing */\n}\n\n:root[data-mode=\"xlarge\"] {\n  --height-popup-max: 760; /* @kind spacing */\n  --margin-action-contents-bottom: 0; /* @kind spacing */\n  --margin-action-normal-horizontal: 32; /* @kind spacing */\n  --margin-action-normal-vertical: 24; /* @kind spacing */\n  --margin-content-content: 32; /* @kind spacing */\n  --margin-navigation-horizontal: 28; /* @kind spacing */\n  --margin-navigation-normal: 24; /* @kind spacing */\n  --margin-navigation-text: 4; /* @kind spacing */\n  --margin-navigation-tool-tab: 20; /* @kind spacing */\n  --padding-horizontal: 24; /* @kind spacing */\n  --padding-vertical: 8; /* @kind spacing */\n  --radius-2: 20; /* @kind radius */\n  --radius-3: 20; /* @kind radius */\n  --radius: 20; /* @kind radius */\n  --width-max: 1060; /* @kind spacing */\n  --width-min: 320; /* @kind spacing */\n  --width-normal: 560; /* @kind spacing */\n}\n\n:root[data-mode=\"dim\"] {\n  --bg-context: \"Dim\"; /* @kind other */\n}\n\n:root[data-theme=\"light\"], .light {\n  --labels-vibrant-controls-primary: rgb(64,64,64); /* @kind color */\n  --mode-2: \"IC - Light\"; /* @kind other */\n}\n<\u002Fstyle>\n<style>/* Wanted Design System — curated semantic color aliases.\n   fig-tokens.css already carries the full variable set (Primary/*, Label/*,\n   Background/*, Fill/*, Line/*, Status/*) with light + dark modes. This file\n   adds short, memorable aliases used throughout the components and cards, so\n   authors write var(--wds-primary) rather than var(--primary-normal). */\n\n:root {\n  /* Brand / primary — Wanted blue */\n  --wds-primary: var(--primary-normal-4);      /* #0066FF */\n  --wds-primary-strong: var(--primary-strong); /* hover/pressed */\n  --wds-primary-heavy: var(--primary-heavy);\n  --wds-primary-bg: var(--blue-95);            /* tinted surface */\n\n  /* Text / labels */\n  --wds-label-strong: var(--label-strong);     /* pure black — strongest */\n  --wds-label: var(--label-normal);            /* default body text */\n  --wds-label-neutral: var(--label-neutral);   /* 88% */\n  --wds-label-alt: var(--label-alternative);   /* 61% — secondary */\n  --wds-label-assistive: var(--label-assistive); /* 28% — placeholder */\n  --wds-label-disable: var(--label-disable);   /* 16% — disabled */\n\n  /* Surfaces */\n  --wds-bg: var(--background-normal-normal);            /* page */\n  --wds-bg-alt: var(--background-normal-alternative);   /* #F7F7F8 grey field */\n  --wds-bg-elevated: var(--background-elevated-normal); /* cards/sheets */\n\n  /* Fills (translucent neutral) */\n  --wds-fill: var(--fill-normal);              /* 8% */\n  --wds-fill-strong: var(--fill-strong);       /* 16% */\n  --wds-fill-alt: var(--fill-alternative);     /* 5% */\n\n  /* Lines / borders */\n  --wds-line: var(--line-normal-normal);       /* 22% hairline */\n  --wds-line-neutral: var(--line-normal-neutral);\n  --wds-line-alt: var(--line-normal-alternative);\n  --wds-line-strong: var(--line-normal-strong);\n\n  /* Status */\n  --wds-positive: var(--status-positive);      /* green #00BF40 */\n  --wds-negative: var(--status-negative);      /* red #FF4242 */\n  --wds-cautionary: var(--status-cautionary);  /* orange #FF9200 */\n\n  /* Inverse (dark chips, tooltips, toasts) */\n  --wds-inverse-bg: var(--inverse-background);\n  --wds-inverse-label: var(--inverse-label);\n\n  /* Static */\n  --wds-white: var(--static-white);\n  --wds-black: var(--static-black);\n}\n<\u002Fstyle>\n<style>/* Wanted Design System — Typography\n   The Wanted type ramp: Display → Title → Heading → Headline → Body → Label → Caption.\n   Each step has a fixed size, line-height and letter-spacing (optical, tightening as\n   size grows). Pretendard is the UI face; weights run 400 / 500 / 600 / 700.\n   Tokens below double as CSS classes (.wds-title-1, …) and custom properties. */\n\n:root {\n  /* Font sizes */\n  --font-size-display-1: 56px;\n  --font-size-display-2: 40px;\n  --font-size-display-3: 36px;\n  --font-size-title-1: 32px;\n  --font-size-title-2: 28px;\n  --font-size-title-3: 24px;\n  --font-size-heading-1: 22px;\n  --font-size-heading-2: 20px;\n  --font-size-headline-1: 18px;\n  --font-size-headline-2: 17px;\n  --font-size-body-1: 16px;\n  --font-size-body-2: 15px;\n  --font-size-label-1: 14px;\n  --font-size-label-2: 13px;\n  --font-size-caption-1: 12px;\n  --font-size-caption-2: 11px;\n\n  /* Weights */\n  --font-weight-regular: 400;\n  --font-weight-medium: 500;\n  --font-weight-semibold: 600;\n  --font-weight-bold: 700;\n}\n\n/* Type ramp classes — pair with a weight (default 500 medium for body, 600/700 for headings). */\n.wds-display-1 { font-family: var(--font-sans); font-size: 56px; line-height: 72px; letter-spacing: -0.0319em; font-weight: 700; }\n.wds-display-2 { font-family: var(--font-sans); font-size: 40px; line-height: 52px; letter-spacing: -0.0282em; font-weight: 700; }\n.wds-display-3 { font-family: var(--font-sans); font-size: 36px; line-height: 48px; letter-spacing: -0.027em;  font-weight: 700; }\n.wds-title-1   { font-family: var(--font-sans); font-size: 32px; line-height: 44px; letter-spacing: -0.0253em; font-weight: 700; }\n.wds-title-2   { font-family: var(--font-sans); font-size: 28px; line-height: 38px; letter-spacing: -0.0236em; font-weight: 700; }\n.wds-title-3   { font-family: var(--font-sans); font-size: 24px; line-height: 32px; letter-spacing: -0.023em;  font-weight: 700; }\n.wds-heading-1 { font-family: var(--font-sans); font-size: 22px; line-height: 30px; letter-spacing: -0.0194em; font-weight: 600; }\n.wds-heading-2 { font-family: var(--font-sans); font-size: 20px; line-height: 28px; letter-spacing: -0.012em;  font-weight: 600; }\n.wds-headline-1{ font-family: var(--font-sans); font-size: 18px; line-height: 26px; letter-spacing: -0.002em;  font-weight: 600; }\n.wds-headline-2{ font-family: var(--font-sans); font-size: 17px; line-height: 24px; letter-spacing: 0em;       font-weight: 600; }\n.wds-body-1    { font-family: var(--font-sans); font-size: 16px; line-height: 24px; letter-spacing: 0.0057em;  font-weight: 400; }\n.wds-body-1-reading { font-family: var(--font-sans); font-size: 16px; line-height: 26px; letter-spacing: 0.0057em; font-weight: 400; }\n.wds-body-2    { font-family: var(--font-sans); font-size: 15px; line-height: 22px; letter-spacing: 0.0096em;  font-weight: 400; }\n.wds-body-2-reading { font-family: var(--font-sans); font-size: 15px; line-height: 24px; letter-spacing: 0.0096em; font-weight: 400; }\n.wds-label-1   { font-family: var(--font-sans); font-size: 14px; line-height: 20px; letter-spacing: 0.0145em;  font-weight: 500; }\n.wds-label-1-reading { font-family: var(--font-sans); font-size: 14px; line-height: 22px; letter-spacing: 0.0145em; font-weight: 500; }\n.wds-label-2   { font-family: var(--font-sans); font-size: 13px; line-height: 18px; letter-spacing: 0.0194em;  font-weight: 500; }\n.wds-caption-1 { font-family: var(--font-sans); font-size: 12px; line-height: 16px; letter-spacing: 0.0252em;  font-weight: 500; }\n.wds-caption-2 { font-family: var(--font-sans); font-size: 11px; line-height: 14px; letter-spacing: 0.0311em;  font-weight: 500; }\n<\u002Fstyle>\n<style>/* Wanted Design System — Spacing & Radius\n   Wanted uses a 4px base grid. Layout margins step 16 / 20 / 24 / 32 by breakpoint.\n   These are convenience px tokens (the raw Figma variables in fig-tokens.css are\n   unitless floats meant for calc(var(--x) * 1px)). */\n\n:root {\n  /* Spacing scale (4px base) */\n  --space-0: 0px;\n  --space-1: 2px;\n  --space-2: 4px;\n  --space-3: 6px;\n  --space-4: 8px;\n  --space-5: 10px;\n  --space-6: 12px;\n  --space-8: 16px;\n  --space-10: 20px;\n  --space-12: 24px;\n  --space-16: 32px;\n  --space-20: 40px;\n  --space-24: 48px;\n  --space-32: 64px;\n\n  /* Corner radius — Wanted favours soft, generous rounding. */\n  --radius-xs: 4px;\n  --radius-sm: 8px;\n  --radius-md: 12px;   /* default control radius */\n  --radius-lg: 16px;\n  --radius-xl: 20px;\n  --radius-2xl: 24px;\n  --radius-full: 9999px;\n\n  /* Elevation — subtle, neutral, no colored glows. */\n  --shadow-1: 0 1px 2px rgba(23, 23, 23, 0.06), 0 1px 3px rgba(23, 23, 23, 0.07);\n  --shadow-2: 0 2px 8px rgba(23, 23, 23, 0.07), 0 1px 2px rgba(23, 23, 23, 0.06);\n  --shadow-3: 0 4px 16px rgba(23, 23, 23, 0.1), 0 2px 4px rgba(23, 23, 23, 0.06);\n  --shadow-4: 0 8px 28px rgba(23, 23, 23, 0.12), 0 2px 8px rgba(23, 23, 23, 0.08);\n\n  /* Layout */\n  --layout-max-width: 1060px;\n  --layout-margin: 20px;\n}\n<\u002Fstyle>\n<style>/* Wanted Design System — base reset & body defaults.\n   Light-touch: normalize box model, set the UI typeface, sane defaults. */\n\n*, *::before, *::after { box-sizing: border-box; }\n\nhtml { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }\n\nbody {\n  margin: 0;\n  font-family: var(--font-sans);\n  font-size: var(--font-size-body-1);\n  line-height: 1.5;\n  letter-spacing: 0.0057em;\n  color: var(--wds-label);\n  background: var(--wds-bg);\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n}\n\nh1, h2, h3, h4, h5, h6, p, figure { margin: 0; }\n\na { color: inherit; text-decoration: none; }\n\nbutton, input, select, textarea { font-family: inherit; }\n\n::selection { background: var(--blue-90); }\n<\u002Fstyle>\n<style>/* ============================================================\n   Wanted Design System — global stylesheet entry point.\n   Consumers link THIS file. It is an @import manifest only.\n   ============================================================ */\n\n/* Wanted Design System — Webfonts\n   Primary UI typeface: Pretendard (the design file uses \"Pretendard JP\";\n   the Latin/variable build Pretendard is the closest open distribution).\n   Brand display typeface: Wanted Sans (Wanted's own open-source family).\n   Both are served from jsDelivr. Self-host the woff2 for production. */\n\n@font-face {\n  font-family: \"Pretendard\";\n  font-weight: 45 920;\n  font-style: normal;\n  font-display: swap;\n ily: var(--font-sans); font-size: 56px; line-height: 72px; letter-spacing: -0.0319em; font-weight: 700; }\n.wds-display-2 { font-family: var(--font-sans); font-size: 40px; line-height: 52px; letter-spacing: -0.0282em; font-weight: 700; }\n.wds-display-3 { font-family: var(--font-sans); font-size: 36px; line-height: 48px; letter-spacing: -0.027em;  font-weight: 700; }\n.wds-title-1   { font-family: var(--font-sans); font-size: 32px; line-height: 44px; letter-spacing: -0.0253em; font-weight: 700; }\n.wds-title-2   { font-family: var(--font-sans); font-size: 28px; line-height: 38px; letter-spacing: -0.0236em; font-weight: 700; }\n.wds-title-3   { font-family: var(--font-sans); font-size: 24px; line-height: 32px; letter-spacing: -0.023em;  font-weight: 700; }\n.wds-heading-1 { font-family: var(--font-sans); font-size: 22px; line-height: 30px; letter-spacing: -0.0194em; font-weight: 600; }\n.wds-heading-2 { font-family: var(--font-sans); font-size: 20px; line-height: 28px; letter-spacing: -0.012em;  font-weight: 600; }\n.wds-headline-1{ font-family: var(--font-sans); font-size: 18px; line-height: 26px; letter-spacing: -0.002em;  font-weight: 600; }\n.wds-headline-2{ font-family: var(--font-sans); font-size: 17px; line-height: 24px; letter-spacing: 0em;       font-weight: 600; }\n.wds-body-1    { font-family: var(--font-sans); font-size: 16px; line-height: 24px; letter-spacing: 0.0057em;  font-weight: 400; }\n.wds-body-1-reading { font-family: var(--font-sans); font-size: 16px; line-height: 26px; letter-spacing: 0.0057em; font-weight: 400; }\n.wds-body-2    { font-family: var(--font-sans); font-size: 15px; line-height: 22px; letter-spacing: 0.0096em;  font-weight: 400; }\n.wds-body-2-reading { font-family: var(--font-sans); font-size: 15px; line-height: 24px; letter-spacing: 0.0096em; font-weight: 400; }\n.wds-label-1   { font-family: var(--font-sans); font-size: 14px; line-height: 20px; letter-spacing: 0.0145em;  font-weight: 500; }\n.wds-label-1-reading { font-family: var(--font-sans); font-size: 14px; line-height: 22px; letter-spacing: 0.0145em; font-weight: 500; }\n.wds-label-2   { font-family: var(--font-sans); font-size: 13px; line-height: 18px; letter-spacing: 0.0194em;  font-weight: 500; }\n.wds-caption-1 { font-family: var(--font-sans); font-size: 12px; line-height: 16px; letter-spacing: 0.0252em;  font-weight: 500; }\n.wds-caption-2 { font-family: var(--font-sans); font-size: 11px; line-height: 14px; letter-spacing: 0.0311em;  font-weight: 500; }\n      /* type ramp: sizes, weights, .wds-* classes */\n/* Wanted Design System — Spacing & Radius\n   Wanted uses a 4px base grid. Layout margins step 16 / 20 / 24 / 32 by breakpoint.\n   These are convenience px tokens (the raw Figma variables in fig-tokens.css are\n   unitless floats meant for calc(var(--x) * 1px)). */\n\n:root {\n  /* Spacing scale (4px base) */\n  --space-0: 0px;\n  --space-1: 2px;\n  --space-2: 4px;\n  --space-3: 6px;\n  --space-4: 8px;\n  --space-5: 10px;\n  --space-6: 12px;\n  --space-8: 16px;\n  --space-10: 20px;\n  --space-12: 24px;\n  --space-16: 32px;\n  --space-20: 40px;\n  --space-24: 48px;\n  --space-32: 64px;\n\n  /* Corner radius — Wanted favours soft, generous rounding. */\n  --radius-xs: 4px;\n  --radius-sm: 8px;\n  --radius-md: 12px;   /* default control radius */\n  --radius-lg: 16px;\n  --radius-xl: 20px;\n  --radius-2xl: 24px;\n  --radius-full: 9999px;\n\n  /* Elevation — subtle, neutral, no colored glows. */\n  --shadow-1: 0 1px 2px rgba(23, 23, 23, 0.06), 0 1px 3px rgba(23, 23, 23, 0.07);\n  --shadow-2: 0 2px 8px rgba(23, 23, 23, 0.07), 0 1px 2px rgba(23, 23, 23, 0.06);\n  --shadow-3: 0 4px 16px rgba(23, 23, 23, 0.1), 0 2px 4px rgba(23, 23, 23, 0.06);\n  --shadow-4: 0 8px 28px rgba(23, 23, 23, 0.12), 0 2px 8px rgba(23, 23, 23, 0.08);\n\n  /* Layout */\n  --layout-max-width: 1060px;\n  --layout-margin: 20px;\n}\n         /* spacing scale, radius, elevation */\n/* Wanted Design System — base reset & body defaults.\n   Light-touch: normalize box model, set the UI typeface, sane defaults. */\n\n*, *::before, *::after { box-sizing: border-box; }\n\nhtml { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }\n\nbody {\n  margin: 0;\n  font-family: var(--font-sans);\n  font-size: var(--font-size-body-1);\n  line-height: 1.5;\n  letter-spacing: 0.0057em;\n  color: var(--wds-label);\n  background: var(--wds-bg);\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n}\n\nh1, h2, h3, h4, h5, h6, p, figure { margin: 0; }\n\na { color: inherit; text-decoration: none; }\n\nbutton, input, select, textarea { font-family: inherit; }\n\n::selection { background: var(--blue-90); }\n            /* light reset + body defaults */\n<\u002Fstyle>\n<script src=\"c96c4039-9c5b-4648-bdfe-ea228d8e26f7\"><\u002Fscript>\n<style>\n*{box-sizing:border-box;}\n.cc{font-family:'Pretendard',-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;color:#2A2520;}\n.ph{position:relative;width:240px;height:436px;background:#FBF7EF;border:1px solid #EAE3D6;border-radius:22px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 2px 8px rgba(40,30,15,.10);}\n.cap{margin-top:11px;font-weight:600;font-size:11.5px;line-height:1.5;color:#5A5248;letter-spacing:-.2px;}\n.cap b{color:#1B6249;font-weight:800;}\n.idb{position:absolute;top:-30px;left:0;font-weight:800;font-size:13px;color:#fff;padding:4px 11px;border-radius:8px;letter-spacing:-.2px;white-space:nowrap;box-shadow:0 2px 6px rgba(40,30,15,.18);}\n.lbl{position:absolute;top:-25px;left:2px;font-weight:800;font-size:12px;letter-spacing:-.2px;}\n.hbar{padding:13px 14px 12px;color:#fff;}\n.row{display:flex;}\n.chip{font-size:9px;font-weight:800;padding:2px 6px;border-radius:6px;flex:none;}\n.hot{background:#FBEAE5;color:#D9533B;} .ice{background:#E7F0F8;color:#3B82C4;}\n.av{border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;flex:none;}\n.card{background:#fff;border:1px solid #EAE3D6;border-radius:13px;}\n.dia{position:relative;width:84px;height:84px;}\n.dia .sq{position:absolute;inset:7px;transform:rotate(45deg);background:#FFF6DD;border:2.5px solid #E8A13C;border-radius:13px;box-shadow:0 4px 12px rgba(150,110,40,.18);}\n.dia .tx{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;}\n.dia .tx span{font-size:10px;font-weight:800;color:#9A6F26;line-height:1.2;letter-spacing:-.3px;}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<!-- ============ CONNECTOR LAYER (arrows / branches / loops) ============ -->\n<svg style=\"position:absolute;left:0;top:0;width:2240px;height:2320px;z-index:0;pointer-events:none;\" viewBox=\"0 0 2240 2320\" fill=\"none\">\n  <defs>\n    <marker id=\"ahG\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6.4\" markerHeight=\"6.4\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"#1F6E50\"><\u002Fpath><\u002Fmarker>\n    <marker id=\"ahGd\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6.4\" markerHeight=\"6.4\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"#B98B3E\"><\u002Fpath><\u002Fmarker>\n    <marker id=\"ahB\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6.4\" markerHeight=\"6.4\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"#2C6BB0\"><\u002Fpath><\u002Fmarker>\n  <\u002Fdefs>\n\n  <!-- ===== H1 (green, y=578) ===== -->\n  <g stroke=\"#1F6E50\" stroke-width=\"2.6\" stroke-linecap=\"round\">\n    <path d=\"M410 578 H466\" marker-end=\"url(#ahG)\"><\u002Fpath>\n    <path d=\"M710 578 H816\" marker-end=\"url(#ahG)\"><\u002Fpath>\n    <path d=\"M1060 578 H1166\" marker-end=\"url(#ahG)\"><\u002Fpath>\n    <path d=\"M1410 578 H1516\" marker-end=\"url(#ahG)\"><\u002Fpath>\n    <path d=\"M1760 578 H1866\" marker-end=\"url(#ahG)\"><\u002Fpath>\n    <path d=\"M1815 622 L1815 846 L1640 846 L1640 804\" stroke-dasharray=\"7 6\" marker-end=\"url(#ahG)\"><\u002Fpath>\n  <\u002Fg>\n  <g font-family=\"Pretendard, sans-serif\" font-weight=\"800\" fill=\"#1B6249\">\n    <text x=\"438\" y=\"566\" font-size=\"11\" text-anchor=\"middle\">시작<\u002Ftext>\n    <text x=\"1815\" y=\"478\" font-size=\"11.5\" text-anchor=\"middle\">아니오 → 확정 진행<\u002Ftext>\n    <text x=\"1720\" y=\"876\" font-size=\"11.5\" text-anchor=\"middle\">예 → S4 다시 검증<\u002Ftext>\n  <\u002Fg>\n\n  <!-- ===== H2 (gold, y=1218) ===== -->\n  <g stroke=\"#B98B3E\" stroke-width=\"2.6\" stroke-linecap=\"round\">\n    <path d=\"M410 1218 H466\" marker-end=\"url(#ahGd)\"><\u002Fpath>\n    <path d=\"M710 1218 H816\" marker-end=\"url(#ahGd)\"><\u002Fpath>\n    <path d=\"M1060 1218 H1166\" marker-end=\"url(#ahGd)\"><\u002Fpath>\n    <path d=\"M1410 1218 H1516\" marker-end=\"url(#ahGd)\"><\u002Fpath>\n    <path d=\"M1760 1218 H1866\" marker-end=\"url(#ahGd)\"><\u002Fpath>\n    <path d=\"M1465 1262 L1465 1486 L940 1486 L940 1444\" stroke-dasharray=\"7 6\" marker-end=\"url(#ahGd)\"><\u002Fpath>\n  <\u002Fg>\n  <g font-family=\"Pretendard, sans-serif\" font-weight=\"800\" fill=\"#9A6F26\">\n    <text x=\"438\" y=\"1206\" font-size=\"11\" text-anchor=\"middle\">시작<\u002Ftext>\n    <text x=\"1465\" y=\"948\" font-size=\"11.5\" text-anchor=\"middle\">아니오 → 정리·완료<\u002Ftext>\n    <text x=\"1190\" y=\"1516\" font-size=\"11.5\" text-anchor=\"middle\">예 → S2 계속 듣기 (자동 반복)<\u002Ftext>\n  <\u002Fg>\n\n  <!-- ===== H3 (blue, y=1858) ===== -->\n  <g stroke=\"#2C6BB0\" stroke-width=\"2.6\" stroke-linecap=\"round\">\n    <path d=\"M410 1858 H466\" marker-end=\"url(#ahB)\"><\u002Fpath>\n    <path d=\"M710 1858 H816\" marker-end=\"url(#ahB)\"><\u002Fpath>\n    <path d=\"M1060 1858 H1166\" marker-end=\"url(#ahB)\"><\u002Fpath>\n    <path d=\"M1410 1858 H1516\" marker-end=\"url(#ahB)\"><\u002Fpath>\n    <path d=\"M1760 1858 H1866\" marker-end=\"url(#ahB)\"><\u002Fpath>\n    <path d=\"M1815 1902 L1815 2126 L1640 2126 L1640 2084\" stroke-dasharray=\"7 6\" marker-end=\"url(#ahB)\"><\u002Fpath>\n  <\u002Fg>\n  <g font-family=\"Pretendard, sans-serif\" font-weight=\"800\" fill=\"#1A4FA0\">\n    <text x=\"438\" y=\"1846\" font-size=\"11\" text-anchor=\"middle\">시작<\u002Ftext>\n    <text x=\"1115\" y=\"1838\" font-size=\"11\" text-anchor=\"middle\">공유 링크 전송<\u002Ftext>\n    <text x=\"1465\" y=\"1838\" font-size=\"11\" text-anchor=\"middle\">등록 → 현황 반영<\u002Ftext>\n    <text x=\"1815\" y=\"1758\" font-size=\"11.5\" text-anchor=\"middle\">예 → 마감<\u002Ftext>\n    <text x=\"1720\" y=\"2156\" font-size=\"11.5\" text-anchor=\"middle\">아니오 → 리마인드 후 재확인<\u002Ftext>\n  <\u002Fg>\n<\u002Fsvg>\n\n<!-- ============ TITLE ============ -->\n<div class=\"cc\" style=\"position:absolute;left:80px;top:40px;width:1010px;z-index:2;\">\n  <div style=\"display:inline-flex;align-items:center;gap:8px;background:#1B6249;color:#fff;font-size:12px;font-weight:800;padding:6px 13px;border-radius:20px;letter-spacing:-.2px;\">CALLCOFFEE · 플로우 구조 검토 보드<\u002Fdiv>\n  <div style=\"font-size:29px;font-weight:800;letter-spacing:-.7px;margin-top:15px;line-height:1.25;\">화면 단위로 플로우를 점검하고<br>화면 ID로 수정 주문하는 보드<\u002Fdiv>\n  <div style=\"font-size:13.5px;line-height:1.65;color:#6E665C;margin-top:11px;max-width:760px;\">3개의 제품 가설(신뢰·속도·분산 참여)이 각 행이고, 오른쪽으로 화면이 <b style=\"color:#2A2520;\">실선 화살표<\u002Fb> 순서대로 이어집니다. 노란 <b style=\"color:#9A6F26;\">다이아몬드(◇)<\u002Fb>는 분기(조건)이고, <b style=\"color:#2A2520;\">점선<\u002Fb>은 되돌아가는 루프예요. 각 화면 왼쪽 위의 <b style=\"color:#2A2520;\">큰 ID 배지(예: H1·S4)<\u002Fb>로 콕 집어 “여기 이렇게 바꿔줘”라고 주문하시면 됩니다.<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ============ LEGEND ============ -->\n<div class=\"cc\" style=\"position:absolute;left:1140px;top:40px;width:470px;z-index:2;\">\n  <div style=\"background:#fff;border:1px solid #EAE3D6;border-radius:16px;padding:16px 18px;box-shadow:0 4px 14px rgba(40,30,15,.08);\">\n    <div style=\"font-size:13px;font-weight:800;color:#2A2520;letter-spacing:-.2px;\">기호 보는 법<\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:9px;margin-top:11px;\">\n      <div style=\"display:flex;align-items:center;gap:10px;font-size:12px;color:#5A5248;\"><svg width=\"34\" height=\"12\" style=\"flex:none;\"><path d=\"M2 6 H26\" stroke=\"#1F6E50\" stroke-width=\"2.6\" marker-end=\"url(#ahG)\"><\u002Fpath><\u002Fsvg><span><b style=\"color:#2A2520;\">실선 화살표<\u002Fb> — 다음 화면 순서<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:10px;font-size:12px;color:#5A5248;\"><svg width=\"34\" height=\"14\" style=\"flex:none;\"><rect x=\"9\" y=\"2\" width=\"10\" height=\"10\" transform=\"rotate(45 14 7)\" fill=\"#FFF6DD\" stroke=\"#E8A13C\" stroke-width=\"2\"><\u002Frect><\u002Fsvg><span><b style=\"color:#9A6F26;\">다이아몬드 ◇<\u002Fb> — 분기(조건). 예/아니오로 갈림<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:10px;font-size:12px;color:#5A5248;\"><svg width=\"34\" height=\"12\" style=\"flex:none;\"><path d=\"M2 6 H26\" stroke=\"#1F6E50\" stroke-width=\"2.6\" stroke-dasharray=\"6 5\" marker-end=\"url(#ahG)\"><\u002Fpath><\u002Fsvg><span><b style=\"color:#2A2520;\">점선<\u002Fb> — 앞 화면으로 되돌아가는 루프<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:10px;font-size:12px;color:#5A5248;\"><span style=\"flex:none;background:#1F6E50;color:#fff;font-size:11px;font-weight:800;padding:3px 8px;border-radius:7px;\">H1·S4<\u002Fspan><span><b style=\"color:#2A2520;\">ID 배지<\u002Fb> — 화면 고유 번호 (가설·단계)<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"margin-top:13px;padding-top:12px;border-top:1px solid #F0EADD;font-size:11.5px;line-height:1.6;color:#6E665C;\">\n      <b style=\"color:#2A2520;\">수정 주문 예시<\u002Fb><br>· “H2·S3 다음에 확인 화면 하나 추가해줘”<br>· “H1·D1 분기 없애고 바로 S5로 가게”<br>· “H3·S3·참여자와 S4·담당자 순서 바꿔줘”\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ===================================================== -->\n<!-- ===================== H1 신뢰 ======================= -->\n<!-- ===================================================== -->\n<div class=\"cc\" data-screen-label=\"H1\" style=\"position:absolute;left:80px;top:360px;width:330px;z-i
